[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "PyNCBI"
dynamic = ["version"]
description = "Programmatic & Agent-Ready Python Engine, CLI, and MCP Server for NCBI (GEO, Entrez, PubMed, Gene, SRA, FASTA)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Konstantinovsky", email = "thomaskon90@gmail.com" }]
keywords = [
    "ncbi",
    "geo",
    "entrez",
    "pubmed",
    "sra",
    "fasta",
    "bioinformatics",
    "genomics",
    "rnaseq",
    "epigenetics",
    "methylation",
    "mcp",
    "ai-agents",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
pyncbi = "PyNCBI.cli.main:main"

[project.urls]
Homepage = "https://github.com/MuteJester/PyNCBI"
Documentation = "https://pyncbi.readthedocs.io/"
Repository = "https://github.com/MuteJester/PyNCBI"
Issues = "https://github.com/MuteJester/PyNCBI/issues"
Changelog = "https://github.com/MuteJester/PyNCBI/releases"

[project.optional-dependencies]
protocol-test = ["mcp>=1.20.0"]
dev = [
    "requests>=2.31.0",  # independent HTTP test client; never a runtime dependency
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.17.2,<0.18",
    "mypy>=1.10.0",
    "pytest-timeout>=2.3.0",
    "vermin>=1.6.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=2.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "PyNCBI.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.pyi", "resources/*.md", "resources/*.txt", "resources/schemas/*.json"]

# Ruff configuration (replaces flake8, isort, black)
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["PyNCBI"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# Mypy checks the standard-library-only runtime.
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
filterwarnings = [
    "ignore:np.find_common_type is deprecated:DeprecationWarning",
    "ignore:Attribute n is deprecated:DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring network access",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/PyNCBI"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
