name: PyNCBI CI & Publish

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  schedule:
    # Weekly live run against NCBI so endpoint changes are caught early (Mondays 06:00 UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,protocol-test]"
      - name: Generated Session typing and agent skill
        run: |
          python scripts/gen_session_stubs.py --check
          python scripts/sync_agent_skill.py --check
      - name: Ruff lint
        run: ruff check src tests docs/scripts scripts
      - name: Ruff format check
        run: ruff format --check src tests docs/scripts scripts
      - name: Python floor (must stay importable on 3.10)
        run: vermin --target=3.10 --violations --eval-annotations --no-tips src/PyNCBI
      - name: mypy
        run: mypy src/PyNCBI
      - name: Independent MCP client (stdio and HTTP)
        run: python scripts/check_mcp_client.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests (offline)
        run: pytest tests/ -m "not integration" -p no:cacheprovider
      - name: Coverage floor (primary job only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pytest tests/ -m "not integration" --cov=PyNCBI --cov-report=term-missing --cov-fail-under=60

  docs:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Generate CLI reference and JSON schemas
        run: |
          python docs/scripts/gen_cli_reference.py
          python scripts/gen_schemas.py
      - name: Fail if generated artifacts are stale
        run: git diff --exit-code -- docs/source/cli.rst src/PyNCBI/resources/schemas
      - name: Build docs (warnings are errors)
        run: python -m sphinx -W -b html docs/source docs/_build/html

  build:
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Verify archives and installed wheel
        run: python scripts/check_distribution.py dist --smoke
      - name: Test the unpacked source distribution
        run: |
          pip install pytest pytest-cov pytest-timeout ruff
          python - <<'PYTHON'
          import glob, pathlib, tarfile
          destination = pathlib.Path("/tmp/pyncbi-sdist-check")
          with tarfile.open(glob.glob("dist/*.tar.gz")[0]) as archive:
              archive.extractall(destination, filter="data")
          PYTHON
          cd /tmp/pyncbi-sdist-check/pyncbi-*
          pip install -e ".[dev]"
          pytest -m "not integration" -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  live-integration:
    # Runs on the weekly schedule and manual dispatch only (needs network access to NCBI)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      PYNCBI_AGENT_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Live NCBI integration tests
        run: pytest tests/ -m integration -p no:cacheprovider --timeout=900

  deploy:
    needs: [quality, test, docs, build, live-integration]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYTHON'
          import ast, os, pathlib
          tree = ast.parse(pathlib.Path("src/PyNCBI/__init__.py").read_text(encoding="utf-8"))
          version = next(ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets))
          assert os.environ["RELEASE_TAG"].removeprefix("v") == version, "Release tag differs from package version"
          PYTHON
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
